name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: africheck_test
          POSTGRES_USER: africheck
          POSTGRES_PASSWORD: africheck_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U africheck -d africheck_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://africheck:africheck_test_password@127.0.0.1:5432/africheck_test
      DATABASE_SSL: "false"
      HISTORY_RETENTION_DAYS: "30"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Run quality gates
        run: npm run ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Generate CycloneDX production SBOM
        run: npm sbom --sbom-format cyclonedx --omit=dev > africheck-sbom.cdx.json
      - name: Validate SBOM structure
        run: node -e "const s=require('./africheck-sbom.cdx.json');if(s.bomFormat!=='CycloneDX'||!s.metadata?.component?.name||!Array.isArray(s.components)||s.components.length===0)process.exit(1)"
      - name: Publish SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: africheck-sbom-${{ github.sha }}
          path: africheck-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
  container:
    name: Build hardened container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Dockerfile
        run: docker build --check .
      - name: Validate Compose deployment
        env:
          POSTGRES_PASSWORD: ci_database_password
          DOMAIN_VERIFICATION_KEY: ci-domain-verification-key-at-least-32
          LOG_HASH_KEY: ci-log-pseudonymization-key-at-least-32
        run: docker compose config --quiet
      - name: Build container image
        run: docker build --tag africheck:ci .
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: africheck:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: 1
      - name: Publish container security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: africheck-container-security-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 30
